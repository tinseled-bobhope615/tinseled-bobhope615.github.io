name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A3643F: ${{ secrets.A3643F }}
          B79433: ${{ secrets.B79433 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A3643F', '')
          env_b = os.environ.get('B79433', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 1372da781d8fe6e8177bfc4058832b -->', env_a)
          if env_b:
              result = result.replace('<!-- 7055c3e59db7860f769fffda41544b93137042c1c3eb54 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
